services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/learning_platform
      DB_USER: learning
      DB_PASSWORD: learning
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
