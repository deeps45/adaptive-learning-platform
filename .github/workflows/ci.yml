name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests (unit + Testcontainers integration, real Postgres)
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/learning_platform
          DB_USER: learning
          DB_PASSWORD: learning
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"; cat /tmp/backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check E2E suite
        working-directory: frontend
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "frontend up"; exit 0
            fi
            sleep 1
          done
          echo "frontend failed to start"; cat /tmp/vite.log; exit 1

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
