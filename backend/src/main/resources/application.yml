spring:
  application:
    name: adaptive-learning-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USER:learning}
    password: ${DB_PASSWORD:learning}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  rate-limit:
    auth-requests-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.learning.platform: INFO
